name: link-check

on:
  schedule:
    - cron: '0 8 * * 3'  # Every Wednesday at 08:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'i18n/README.md'

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in documentation
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429
            --exclude-mail
            --exclude "^https://github.com/chenfei462/packsmith/(tree|blob)/"
            --exclude "localhost"
            --exclude "127.0.0.1"
            --timeout 30
            --max-retries 3
            --max-concurrency 5
            "README.md"
            "CONTRIBUTING.md"
            "ROADMAP.md"
            "CHANGELOG.md"
            "docs/**/*.md"
            "i18n/README.md"
          output: link-report.md
          fail: false

      - name: Read link report
        id: report
        run: |
          if [ -f link-report.md ]; then
            BROKEN=$(grep -c "^\[ERR\]" link-report.md || echo "0")
            echo "broken_count=$BROKEN" >> $GITHUB_OUTPUT
            echo "Found $BROKEN broken link(s)"
          else
            echo "broken_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for broken links (scheduled only)
        if: github.event_name == 'schedule' && steps.report.outputs.broken_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('link-report.md')
              ? fs.readFileSync('link-report.md', 'utf8')
              : 'No report generated.';

            const brokenCount = '${{ steps.report.outputs.broken_count }}';

            // Check for existing open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'maintenance,docs'
            });

            const existing = issues.find(i => i.title.includes('Broken links'));

            const body = [
              '## Broken Links Detected',
              '',
              `The weekly link checker found **${brokenCount}** broken link(s) in documentation.`,
              '',
              '```',
              report.split('\n').filter(l => l.includes('[ERR]')).slice(0, 30).join('\n'),
              '```',
              '',
              '---',
              '*Auto-generated by the link-check workflow.*'
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `### Update (${new Date().toISOString().split('T')[0]})\n\n${brokenCount} broken link(s) remain.`
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `Broken links: ${brokenCount} link(s) need fixing`,
                labels: ['maintenance', 'docs'],
                body
              });
            }

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.md
          retention-days: 30
