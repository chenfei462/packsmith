name: docs-site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'registry/**'
      - 'i18n/**'
      - 'official-packs/**'
      - 'docs/assets/**'
      - 'src/**'
      - 'src/cli.mjs'
      - 'src/lib/targets.mjs'
      - 'src/lib/pack.mjs'
      - 'src/lib/registry.mjs'
      - '.github/workflows/docs-site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Build site
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build --prefix site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
