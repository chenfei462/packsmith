name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run evaluation flow
        run: npm run eval

      - name: Publish verification summary
        run: cat docs/verification.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification snapshot
        uses: actions/upload-artifact@v4
        with:
          name: verification-snapshot
          path: |
            docs/verification.json
            docs/verification.md

      - name: Publish to npm
        run: npm publish --provenance --access public
