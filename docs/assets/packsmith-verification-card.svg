    .body { fill: #e2e8f0; font: 500 18px 'Consolas', 'Courier New', monospace; }
    .chip { fill: rgba(15, 23, 42, 0.35); stroke: rgba(191, 219, 254, 0.35); }
  </style>
  <rect width="920" height="360" rx="28" fill="url(#bg)" />
