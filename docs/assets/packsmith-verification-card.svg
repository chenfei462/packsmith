  <text x="32" y="188" class="body">pack files: 6</text>
  <text x="32" y="216" class="body">tarball: chenfei462-packsmith-0.1.0.tgz</text>
  <text x="32" y="244" class="body">shasum: a12ea06a61ed856eeaabd986f0e4748af0fb2aa4</text>
